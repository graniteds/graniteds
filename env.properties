###############################################################################
# Granite Data Services build properties.

# Set 'FLEX_HOME' property to your flex3 (or above) sdk installation directory
# Set 'FLEX_HOME_TESTS' property to your flex 4.5.0 sdk installation directory
# and 'FLEX_TASKS_JAR' to your flexTasks.jar location.
#
# WARNING: the Flex home property must have this exact name ('FLEX_HOME').
FLEX_HOME=/path/to/flex_sdk_3.6
FLEX_HOME_TESTS=/path/to/flex_sdk_4.5
FLEX_TASKS_JAR=${FLEX_HOME}/ant/lib/flexTasks.jar
